nltk_data: /tmp/nltk_data

ai_token: ""

ai_project_id: 1
ai_project_allowed_domains: "centry.user"

public_messages_route: true

add_admin_roles:
- "public_admin"

max_published_versions_per_agent: 3

# Stop the worker when a blocking predict exceeds await_task_timeout
cancel_on_timeout: true

scheduler:
  pipeline_scheduling:
    enabled: true
    cron: "* * * * *"
  index_scheduling:
    enabled: true
    cron: "* * * * *"

pgvector_engine_cache:
  pool_size: 5              # persistent connections per cached engine
  max_overflow: 10          # extra connections per engine allowed beyond pool_size
  max_cached_engines: 32    # hard cap on distinct engines held at once (LRU-evicted beyond this)
  max_idle_seconds: 3600    # idle time before the reaper tick disposes an engine

# Publish validation config references (defaults in code):
# publishing_guardrail.publish_validation_rules - custom AI evaluation rules (default: built-in, via admin UI)
# publish_validation_timeout       - LLM call timeout in seconds (default: 60)
# publish_validation_token_ttl     - HMAC token expiry in seconds (default: 300)
# publish_validation_secret        - HMAC signing key (default: auto-generated on init)
