nltk_data: /tmp/nltk_data

ai_token: ""

# In-cluster base URL of this platform. The internal Elitea MCP toolkits are addressed at it
# (unset: http://pylon_main:8080, never the public app_host, #7278); the runtime's platform client
# uses it too (unset: app_host).
# base_url: http://pylon_main:8080

ai_project_id: 1
ai_project_allowed_domains: "centry.user"

public_messages_route: true

add_admin_roles:
- "public_admin"

max_published_versions_per_agent: 3

# Stop the worker when a blocking predict exceeds await_task_timeout
cancel_on_timeout: true

# Bounds for expanding sub-agents before a predict; what is cut off is fetched by the runtime
predict:
  subagent_prefetch:
    max_nodes: 200
    max_bytes: 15728640
    max_seconds: 40

scheduler:
  pipeline_scheduling:
    enabled: true
    cron: "* * * * *"
  index_scheduling:
    enabled: true
    cron: "* * * * *"
  schedules:
    min_interval_minutes: 5
    max_enabled_per_project: 50
    agent_scheduling_enabled: true
    dispatch_cap: 100
    stale_run_minutes: 120
    max_parallel_runs: 100
    approval_wait_hours: 24
    legacy_step_enabled: true

# Optional badge and effect text of a sensitive tool, shown by the schedule risk review (EL-7011).
# Badges: sends_messages, deletes_data, changes_data, runs_code, needs_approval (the default).
# Manage it from Admin -> Guardrails; a tool without an entry shows "needs_approval".
# toolkit_security:
#   sensitive_tool_info:
#     outlook:
#       send_email: {badge: sends_messages, effect: "Sends e-mail to people inside and outside the company"}

pgvector_engine_cache:
  pool_size: 5              # persistent connections per cached engine
  max_overflow: 10          # extra connections per engine allowed beyond pool_size
  max_cached_engines: 32    # hard cap on distinct engines held at once (LRU-evicted beyond this)
  max_idle_seconds: 3600    # idle time before the reaper tick disposes an engine

# Publish validation config references (defaults in code):
# publishing_guardrail.publish_validation_rules - custom AI evaluation rules (default: built-in, via admin UI)
# publish_validation_timeout       - LLM call timeout in seconds (default: 60)
# publish_validation_token_ttl     - HMAC token expiry in seconds (default: 300)
# publish_validation_secret        - HMAC signing key (default: auto-generated on init)

# Effective-limit ladder defaults. Canonical home for these since the ladder itself now
# lives here (rpc/budget_limits.py) and both inference planes resolve through it.
# Applied ONLY where nothing has been set explicitly on the Budgets page; null means
# unlimited for that scope, so each default can be turned off independently.
# Manage these from Admin -> Features -> Cost Budgets rather than editing by hand.
cost_budgets:
  defaults:
    enabled: false
    project_monthly_limit: null              # team/shared projects
    personal_project_monthly_limit: null     # each user's own project
    user_monthly_limit: null                 # one member's slice inside a project
  # Tool Spend features (#6980), keyed by toolkit metadata `tool_spend.feature`. Separate from
  # the LLM defaults above; the platform switch is off and every limit unlimited by default.
  features:
    web_search:
      enabled: false
      enabled_team: true
      enabled_personal: true
      project_monthly_limit: null
      personal_project_monthly_limit: null
      user_monthly_limit: null

# Enterprise credential governance (C-1009, #6754, #7120). The mode (off, audit_only, enforce), the policy revision and
# both admission flags are set in the Admin UI (Governance) and stored in the database, not here. The deployment keeps
# three environment variables, read from the process environment (never from this file):
#   ELITEA_CREDENTIAL_GOVERNANCE_MAX_MODE     off | audit-only | enforce (default enforce): the highest mode allowed
#   ELITEA_CREDENTIAL_GOVERNANCE_ENABLED      deprecated alias of the ceiling: true = enforce, false = off; it does not
#                                             switch governance on. Setting both and disagreeing refuses startup
#   ELITEA_CREDENTIAL_GOVERNANCE_ENVIRONMENT  label recorded on contexts and audit events; when set, it is read-only in the UI
# Any other former key (enabled, policy_revision, environment, admit_legacy_pat, allow_runtime_domain_binding, or the
# POLICY_REVISION, MODE, ADMIT_LEGACY_PAT and ALLOW_RUNTIME_DOMAIN_BINDING variables) is ignored with a warning.
# Deliberately NOT declared in admin_schema.json, so the admin config editor cannot change it.
enterprise_credential_governance:
  context_ttl_s: 3600                   # how long an admitted run may stay idle before it can no longer start, restart or call the platform (60..86400); a run in use slides it, up to MAX_RUN_LIFETIME_S

# Entra-delegated credentials (C-1009 #6756 step 4): the interim app client of the on-behalf-of exchange, used by a
# credential whose descriptor says oauth_app_id "platform" (an admin-managed OAuth app, #7149, replaces it). The client
# id of the platform's API app registration; its secret is read from the environment variable named here, never from
# this file. Unset: such credentials are refused (DENIED_OAUTH_APP_UNAVAILABLE).
entra_obo_client_id: null
entra_obo_client_secret_env: ELITEA_API_CLIENT_SECRET
# The environment variable holding the key (32+ characters) that signs Main's requests for a person's Microsoft
# sign-in to auth_oidc; pylon_auth's auth_oidc reads the same variable. Unset: delegated credentials are unavailable.
# Both secrets are service-scoped: the client secret is given to pylon_main only, the request key to pylon_main and
# pylon_auth only, never through an env file every pylon loads (pylon_indexer runs toolkit code).
entra_obo_custody_key_env: ELITEA_OBO_CUSTODY_KEY
# Issuers (exact strings) of Keycloak realms that broker the login to Entra (step 4b): a person signed in through one
# of them acts with the Entra sign-in auth_oidc fetched from the realm (obo_assertion_source: keycloak_broker). The
# realm must map Entra's tid/oid into its tokens (the identity verifier's subject_claims). Empty: such a login is
# refused DENIED_ASSERTION_SOURCE_UNSUPPORTED.
entra_obo_broker_issuers: []

# Which identity an autonomous mandate (schedules, webhooks) may name for its runs (#7131): a list of
#   owner_delegated  the runs act with the mandate owner's Microsoft sign-in, through the owner's one-time offline
#                    consent (Governance -> Mandates -> Consent; needs the custody of entra_obo_custody_key_env)
#   application      named for the record: the runs use the application credentials the mandate is granted (SharePoint
#                    App-only, client secret or certificate, with admin-consented application permissions and
#                    Sites.Selected site grants), exactly as a mandate without an identity does
# Empty (the default): no mandate names an identity, nothing about one is read, and a delegated credential in a mandate
# run is refused DENIED_MANDATE_DELEGATION_UNSUPPORTED, as before.
mandate_identity_sources: []
