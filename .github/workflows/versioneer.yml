name: Auto-Increment Version

on:
  push:
    branches:
      - main
      - 'release/**'
  # repository_dispatch always runs the default-branch (main) copy of this file with
  # GITHUB_REF=refs/heads/main, and the shared reusable workflow's bare actions/checkout@v4
  # honours GITHUB_REF. A sender wiring a release-branch build to this event would silently
  # bump main instead of the branch that ships; release-branch coverage needs a `ref:` input
  # on EliteaAI/actions/.github/workflows/versioneer.yml first.
  repository_dispatch:
    types: [elitea-ui-released]
  workflow_dispatch:

permissions:
  contents: write

# The push arm and the dispatch arm are two trigger sources for one read-modify-write of
# metadata.json. Without serialisation both read the same version, both write the same
# increment, and the losing `git push` is rejected non-fast-forward and reds the run.
concurrency:
  group: versioneer-${{ github.ref }}
  cancel-in-progress: false


jobs:
  call-reusable-workflow:
    uses: EliteaAI/actions/.github/workflows/versioneer.yml@main
    with:
      metadata_file: "metadata.json"
      version_key: ".version"
